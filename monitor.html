<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Monitoramento</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#008cba">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Sandapp Monitor">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 640px; background: #000; border: 2px solid #444; border-radius: 8px; display: none; cursor: pointer; }
        .status { margin-top: 15px; color: #aaa; font-weight: bold; }
        #lockScreen { margin-top: 50px; }
        input, select { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 16px; margin: 5px; }
        .btn { padding: 10px 20px; border-radius: 5px; border: none; background: #008cba; color: #fff; font-size: 16px; cursor: pointer; margin: 5px; }
        .btn:hover { background: #005f73; }
        .controls-remote { margin-top: 15px; display: none; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .btn-ctrl { padding: 12px 20px; border-radius: 6px; border: none; background: #ff9800; color: #000; font-size: 16px; font-weight: bold; cursor: pointer; user-select: none; }
        .btn-ctrl:active { background: #e68a00; }
        .btn-mic { background: #4caf50; color: #fff; }
        .btn-mic.talking { background: #f44336; animation: pulse 1s infinite; }
        .cam-selector { margin-bottom: 15px; display: none; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h2>Central de Monitoramento</h2>

    <!-- Tela de Autenticação -->
    <div id="lockScreen">
        <p>Digite a senha para acessar o monitor:</p>
        <input type="password" id="passInput" placeholder="Senha">
        <button class="btn" onclick="checkPassword()">Acessar</button>
        <p id="errorMsg" style="color: #ff5555; display: none; margin-top: 10px;">Senha incorreta!</p>
    </div>

    <!-- Seletor de Câmeras -->
    <div class="cam-selector" id="camSelectorContainer">
        <label for="cameraSelect">Selecione a Câmera: </label>
        <select id="cameraSelect" onchange="connectToSelectedCamera()">
            <option value="">Aguardando câmeras...</option>
        </select>
    </div>

    <!-- Player de Vídeo -->
    <video id="remoteVideo" autoplay playsinline muted controls></video>
    
    <!-- Controles Remotos -->
    <div class="controls-remote" id="remoteControls">
        <button class="btn-ctrl" onclick="sendControl('toggle-camera')">🔄 Alternar Câmera</button>
        <button class="btn-ctrl" onclick="sendControl('toggle-torch')">🔦 Alternar Lanterna</button>
        <button class="btn-ctrl btn-mic" id="btnMic">🎤 Pressione para Falar</button>
    </div>

    <div class="status" id="status" style="display: none;">Selecione uma câmera acima...</div>

    <script>
        const SENHA_CORRETA = "1234";

        const socket = io();
        const remoteVideo = document.getElementById('remoteVideo');
        const statusDiv = document.getElementById('status');
        const lockScreen = document.getElementById('lockScreen');
        const remoteControls = document.getElementById('remoteControls');
        const camSelectorContainer = document.getElementById('camSelectorContainer');
        const cameraSelect = document.getElementById('cameraSelect');
        const errorMsg = document.getElementById('errorMsg');
        const btnMic = document.getElementById('btnMic');

        let activeCamerasList = {};
        let selectedCameraId = null;
        let peerConnection = null;
        let localMicStream = null;

        const config = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelay',
                    credential: 'openrelay'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelay',
                    credential: 'openrelay'
                }
            ] 
        };

        async function initMicStream() {
            try {
                localMicStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                localMicStream.getAudioTracks().forEach(track => track.enabled = false);
            } catch (e) {
                console.log("Microfone do monitor não disponível:", e.message);
            }
        }

        async function checkPassword() {
            const inputVal = document.getElementById('passInput').value;
            if (inputVal === SENHA_CORRETA) {
                await initMicStream();

                lockScreen.style.display = 'none';
                remoteVideo.style.display = 'inline-block';
                remoteControls.style.display = 'flex';
                camSelectorContainer.style.display = 'block';
                statusDiv.style.display = 'block';
                
                socket.emit('register-monitor');
            } else {
                errorMsg.style.display = 'block';
            }
        }

        function getCameraLabel(camData) {
            if (!camData) return 'Câmera';
            if (typeof camData === 'object') {
                return camData.cameraName || camData.name || 'Câmera';
            }
            return camData;
        }

        socket.on('update-camera-list', (cameras) => {
            activeCamerasList = cameras;
            cameraSelect.innerHTML = '<option value="">-- Selecione uma Câmera --</option>';

            for (let id in cameras) {
                const option = document.createElement('option');
                option.value = id;
                option.textContent = getCameraLabel(cameras[id]);
                if (id === selectedCameraId) option.selected = true;
                cameraSelect.appendChild(option);
            }

            if (Object.keys(cameras).length === 0) {
                statusDiv.innerText = "Nenhuma câmera online no momento.";
                statusDiv.style.color = "#aaa";
            }
        });

        function connectToSelectedCamera() {
            selectedCameraId = cameraSelect.value;
            if (!selectedCameraId) {
                statusDiv.innerText = "Selecione uma câmera acima.";
                statusDiv.style.color = "#aaa";
                return;
            }

            const camName = getCameraLabel(activeCamerasList[selectedCameraId]);
            statusDiv.innerText = `Conectando a ${camName}...`;
            statusDiv.style.color = "#ffcc00";

            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }

            socket.emit('request-offer', { 
                targetCameraId: selectedCameraId,
                targetId: selectedCameraId 
            });
        }

        function createPeer(cameraSocketId) {
            if (peerConnection) {
                peerConnection.close();
            }

            peerConnection = new RTCPeerConnection(config);
            
            if (localMicStream) {
                localMicStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localMicStream);
                });
            }

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    if (remoteVideo.srcObject !== event.streams[0]) {
                        remoteVideo.srcObject = event.streams[0];
                        remoteVideo.muted = true;
                        
                        remoteVideo.load();
                        const playPromise = remoteVideo.play();
                        if (playPromise !== undefined) {
                            playPromise.then(() => {
                                console.log("Vídeo exibido com sucesso!");
                            }).catch(error => {
                                console.log("Autoplay retido:", error);
                            });
                        }
                    }

                    const camName = getCameraLabel(activeCamerasList[cameraSocketId]);
                    statusDiv.innerText = `Transmissão On-line: ${camName}`;
                    statusDiv.style.color = "#55ff55";
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('candidate', { 
                        candidate: event.candidate,
                        targetId: cameraSocketId,
                        targetCameraId: cameraSocketId
                    });
                }
            };

            return peerConnection;
        }

        socket.on('offer', async (data) => {
            const cameraSocketId = data.senderId || data.requesterId || data.targetId;
            const pc = createPeer(cameraSocketId);
            await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
            
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);
            
            socket.emit('answer', { 
                answer: answer,
                targetId: cameraSocketId,
                targetCameraId: cameraSocketId
            });
        });

        socket.on('candidate', async (data) => {
            if (peerConnection && data.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => console.log(e));
            }
        });

        function sendControl(action) {
            if (!selectedCameraId) {
                alert("Selecione uma câmera primeiro!");
                return;
            }
            socket.emit('camera-control', { 
                targetCameraId: selectedCameraId, 
                targetId: selectedCameraId,
                action: action 
            });
        }

        function startTalking(e) {
            if (e) e.preventDefault();
            if (!localMicStream) {
                alert("Microfone indisponível ou permissão negada.");
                return;
            }
            localMicStream.getAudioTracks().forEach(track => track.enabled = true);
            btnMic.classList.add('talking');
            btnMic.innerText = "🎙️ Falando...";
        }

        function stopTalking(e) {
            if (e) e.preventDefault();
            if (localMicStream) {
                localMicStream.getAudioTracks().forEach(track => track.enabled = false);
            }
            btnMic.classList.remove('talking');
            btnMic.innerText = "🎤 Pressione para Falar";
        }

        btnMic.addEventListener('mousedown', startTalking);
        btnMic.addEventListener('mouseup', stopTalking);
        btnMic.addEventListener('mouseleave', stopTalking);

        btnMic.addEventListener('touchstart', startTalking);
        btnMic.addEventListener('touchend', stopTalking);
        btnMic.addEventListener('touchcancel', stopTalking);
    </script>
</body>
</html>
