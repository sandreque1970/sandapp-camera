<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera - Emissor Passivo com Áudio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 320px; background: #222; border-radius: 8px; }
        audio { display: none; }
        .status { margin-top: 15px; font-weight: bold; }
        .info { margin-top: 10px; color: #00d2ff; }
        .setup-box { margin-bottom: 15px; background: #222; padding: 15px; border-radius: 8px; display: inline-block; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #111; color: #fff; text-align: center; font-size: 16px; margin-bottom: 10px; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #008cba; color: #fff; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h2 id="camTitle">Identificação da Câmera</h2>

    <!-- Formulário visível para escolher o nome do local -->
    <div class="setup-box" id="nameBox">
        <p style="margin-top:0;">Digite o local/nome desta câmera:</p>
        <input type="text" id="camNameInput" placeholder="Ex: Sala, Garagem, Cozinha" value="Sala">
        <br>
        <button onclick="confirmCameraName()">Iniciar Transmissão</button>
    </div>

    <!-- Interface da Câmera (Inicia oculta) -->
    <div id="camArea" style="display:none;">
        <video id="preview" autoplay playsinline muted></video>
        <audio id="remoteAudio" autoplay></audio>
        <canvas id="motionCanvas" width="160" height="120" style="display:none;"></canvas>

        <div class="status" id="statusLog">Iniciando...</div>
        <div class="info" id="monitorCount">Monitores conectados: 0</div>
    </div>

    <script>
        const socket = io();
        const video = document.getElementById('preview');
        const remoteAudio = document.getElementById('remoteAudio');
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d');
        const statusLog = document.getElementById('statusLog');
        const monitorCountDiv = document.getElementById('monitorCount');
        const camTitle = document.getElementById('camTitle');
        const nameBox = document.getElementById('nameBox');
        const camArea = document.getElementById('camArea');

        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const peers = {}; 
        let localStream = null;
        let prevFrame = null;
        let currentFacingMode = "environment";
        let torchOn = false;
        let cameraName = "Câmera";

        async function confirmCameraName() {
            const inputVal = document.getElementById('camNameInput').value.trim();
            if (inputVal) {
                cameraName = inputVal;
            }
            nameBox.style.display = 'none';
            camArea.style.display = 'block';
            camTitle.innerText = `Câmera: ${cameraName}`;

            // Registra a câmera no servidor
            socket.emit('register-camera', cameraName);

            // Inicia os sensores da câmera e microfone
            await startCamera();
        }

        async function startCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: currentFacingMode } },
                    audio: true
                }).catch(async () => {
                    return await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: currentFacingMode },
                        audio: true
                    });
                });

                video.srcObject = localStream;
                await video.play();
                torchOn = false;

                for (let socketId in peers) {
                    const pc = peers[socketId];
                    localStream.getTracks().forEach(track => {
                        const sender = pc.getSenders().find(s => s.track && s.track.kind === track.kind);
                        if (sender) {
                            sender.replaceTrack(track);
                        } else {
                            pc.addTrack(track, localStream);
                        }
                    });
                }

                statusLog.innerText = `Transmitindo ao vivo (${cameraName})...`;
            } catch (err) {
                statusLog.innerText = "Erro ao acessar câmera/microfone: " + err.message;
            }
        }

        async function toggleCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            await startCamera();
        }

        async function toggleTorch() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            if (!capabilities.torch) return;

            try {
                torchOn = !torchOn;
                await track.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });
            } catch (e) {
                console.log("Erro na lanterna: " + e.message);
            }
        }

        socket.on('camera-control', (action) => {
            if (action === 'toggle-camera') {
                toggleCamera();
            } else if (action === 'toggle-torch') {
                toggleTorch();
            }
        });

        function createPeerForMonitor(monitorSocketId) {
            const pc = new RTCPeerConnection(config);
            peers[monitorSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                if (event.track.kind === 'audio') {
                    remoteAudio.srcObject = event.streams[0];
                    remoteAudio.play().catch(e => console.log("Erro ao tocar áudio do monitor:", e));
                }
            };

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('candidate', { 
                        candidate: e.candidate,
                        targetId: monitorSocketId 
                    });
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    delete peers[monitorSocketId];
                    updateMonitorCount();
                }
            };

            updateMonitorCount();
            return pc;
        }

        function updateMonitorCount() {
            const count = Object.keys(peers).length;
            monitorCountDiv.innerText = `Monitores conectados: ${count}`;
        }

        socket.on('user-connected', async (monitorSocketId) => {
            const pc = createPeerForMonitor(monitorSocketId);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            socket.emit('offer', { 
                offer: offer, 
                targetId: monitorSocketId 
            });
        });

        socket.on('answer', async (data) => {
            const pc = peers[data.senderId];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('candidate', async (data) => {
            const pc = peers[data.senderId];
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function detectMotion() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (prevFrame) {
                let diffCount = 0;
                for (let i = 0; i < currentFrame.data.length; i += 4) {
                    const diff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
                    if (diff > 30) diffCount++;
                }
                if (diffCount > 500) {
                    statusLog.style.color = '#ff5555';
                    statusLog.innerText = "⚠ Movimento Detectado!";
                } else {
                    statusLog.style.color = '#55ff55';
                }
            }
            prevFrame = currentFrame;
        }

        setInterval(detectMotion, 300);
    </script>
</body>
</html>
