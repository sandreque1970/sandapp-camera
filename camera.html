<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera - Multi-Monitor com Controles</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 320px; background: #222; border-radius: 8px; }
        .status { margin-top: 15px; font-weight: bold; }
        .monitors-count { margin-top: 10px; color: #00d2ff; }
        .controls { margin-top: 15px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        button { padding: 10px 15px; border-radius: 6px; border: none; background: #333; color: #fff; font-size: 14px; cursor: pointer; }
        button:hover { background: #555; }
        button.active { background: #ff9800; color: #000; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Câmera Ativa</h2>
    <video id="preview" autoplay playsinline muted></video>
    <canvas id="motionCanvas" width="160" height="120" style="display:none;"></canvas>
    
    <div class="controls">
        <button id="btnFlip" onclick="toggleCamera()">🔄 Alternar Câmera</button>
        <button id="btnTorch" onclick="toggleTorch()">🔦 Lanterna: OFF</button>
    </div>

    <div class="status" id="statusLog">Iniciando...</div>
    <div class="monitors-count" id="monitorCount">Monitores conectados: 0</div>

    <script>
        const socket = io();
        const ROOM_ID = 'minha-casa-segura';
        const video = document.getElementById('preview');
        const canvas = document.getElementById('motionCanvas');
        const ctx = canvas.getContext('2d');
        const statusLog = document.getElementById('statusLog');
        const monitorCountDiv = document.getElementById('monitorCount');
        const btnTorch = document.getElementById('btnTorch');

        const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const peers = {}; 
        let localStream = null;
        let prevFrame = null;
        let currentFacingMode = "environment";
        let torchOn = false;

        async function startCamera() {
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }

            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: currentFacingMode } },
                    audio: false
                }).catch(async () => {
                    return await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: currentFacingMode },
                        audio: false
                    });
                });

                video.srcObject = localStream;
                await video.play();
                torchOn = false;
                btnTorch.classList.remove('active');
                btnTorch.innerText = "🔦 Lanterna: OFF";

                const newTrack = localStream.getVideoTracks()[0];
                for (let socketId in peers) {
                    const pc = peers[socketId];
                    const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(newTrack);
                    }
                }

                statusLog.innerText = `Câmera (${currentFacingMode === 'environment' ? 'Traseira' : 'Frontal'}) pronta!`;
            } catch (err) {
                statusLog.innerText = "Erro ao acessar câmera: " + err.message;
            }
        }

        async function toggleCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            await startCamera();
        }

        async function toggleTorch() {
            if (!localStream) return;
            const track = localStream.getVideoTracks()[0];
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};

            if (!capabilities.torch) {
                return;
            }

            try {
                torchOn = !torchOn;
                await track.applyConstraints({
                    advanced: [{ torch: torchOn }]
                });
                if (torchOn) {
                    btnTorch.classList.add('active');
                    btnTorch.innerText = "🔦 Lanterna: ON";
                } else {
                    btnTorch.classList.remove('active');
                    btnTorch.innerText = "🔦 Lanterna: OFF";
                }
            } catch (e) {
                console.log("Erro na lanterna: " + e.message);
            }
        }

        // Ouvir comandos vindos dos monitores
        socket.on('camera-control', (action) => {
            if (action === 'toggle-camera') {
                toggleCamera();
            } else if (action === 'toggle-torch') {
                toggleTorch();
            }
        });

        function createPeerForMonitor(monitorSocketId) {
            const pc = new RTCPeerConnection(config);
            peers[monitorSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('candidate', { 
                        room: ROOM_ID, 
                        candidate: e.candidate,
                        targetId: monitorSocketId 
                    });
                }
            };

            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'disconnected' || pc.connectionState === 'failed' || pc.connectionState === 'closed') {
                    delete peers[monitorSocketId];
                    updateMonitorCount();
                }
            };

            updateMonitorCount();
            return pc;
        }

        function updateMonitorCount() {
            const count = Object.keys(peers).length;
            monitorCountDiv.innerText = `Monitores conectados: ${count}`;
        }

        socket.emit('join-room', ROOM_ID);

        socket.on('user-connected', async (monitorSocketId) => {
            const pc = createPeerForMonitor(monitorSocketId);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            socket.emit('offer', { 
                room: ROOM_ID, 
                offer: offer, 
                targetId: monitorSocketId 
            });
            
            statusLog.innerText = "Transmitindo para novos monitores...";
        });

        socket.on('answer', async (data) => {
            const pc = peers[data.senderId];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                statusLog.innerText = "Transmissão ativa!";
            }
        });

        socket.on('candidate', async (data) => {
            const pc = peers[data.senderId];
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function detectMotion() {
            if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            
            if (prevFrame) {
                let diffCount = 0;
                for (let i = 0; i < currentFrame.data.length; i += 4) {
                    const diff = Math.abs(currentFrame.data[i] - prevFrame.data[i]);
                    if (diff > 30) diffCount++;
                }
                if (diffCount > 500) {
                    statusLog.style.color = '#ff5555';
                    statusLog.innerText = "⚠ Movimento Detectado!";
                } else {
                    statusLog.style.color = '#55ff55';
                }
            }
            prevFrame = currentFrame;
        }

        startCamera();
        setInterval(detectMotion, 300);
    </script>
</body>
</html>
