<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Câmera Transmissora</title>

    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#008cba">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background: #111; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        video { width: 100%; max-width: 640px; background: #000; border: 2px solid #444; border-radius: 8px; margin-top: 10px; }
        input { padding: 10px; border-radius: 5px; border: 1px solid #444; background: #222; color: #fff; text-align: center; font-size: 16px; }
        .btn { padding: 10px 20px; border-radius: 5px; border: none; background: #28a745; color: #fff; font-size: 16px; cursor: pointer; margin-left: 5px; }
        .btn:hover { background: #218838; }
        .status { margin-top: 15px; color: #aaa; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Câmera Transmissora</h2>
    
    <div id="setup">
        <input type="text" id="cameraName" placeholder="Nome da Câmera (ex: Sala)">
        <button class="btn" onclick="startCamera()">Iniciar Câmera</button>
    </div>

    <video id="localVideo" autoplay playsinline muted></video>
    <audio id="remoteAudio" autoplay></audio>
    <div class="status" id="status">Aguardando início...</div>

    <script>
        const socket = io();
        const localVideo = document.getElementById('localVideo');
        const remoteAudio = document.getElementById('remoteAudio');
        const statusDiv = document.getElementById('status');
        
        let localStream = null;
        let peerConnections = {};
        let wakeLock = null;
        let currentFacingMode = 'environment';
        let isTorchOn = false;

        const config = { 
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:stun3.l.google.com:19302' },
                { urls: 'stun:stun4.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelay',
                    credential: 'openrelay'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelay',
                    credential: 'openrelay'
                }
            ] 
        };

        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {
                console.log(`Wake Lock: ${err.message}`);
            }
        }

        async function getMediaStream() {
            return await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: currentFacingMode,
                    width: { ideal: 640 },
                    height: { ideal: 480 },
                    frameRate: { max: 30 }
                },
                audio: true
            });
        }

        async function startCamera() {
            const nameInput = document.getElementById('cameraName').value.trim();
            if (!nameInput) {
                alert("Por favor, digite um nome para esta câmera!");
                return;
            }

            try {
                localStream = await getMediaStream();
                localVideo.srcObject = localStream;
                document.getElementById('setup').style.display = 'none';
                statusDiv.innerText = `Transmitindo como: "${nameInput}"`;
                statusDiv.style.color = "#55ff55";

                await requestWakeLock();
                socket.emit('register-camera', { cameraName: nameInput });
            } catch (e) {
                alert("Erro ao acessar câmera: " + e.message);
            }
        }

        function createPeerForMonitor(monitorSocketId) {
            if (peerConnections[monitorSocketId]) {
                peerConnections[monitorSocketId].close();
            }

            const pc = new RTCPeerConnection(config);
            peerConnections[monitorSocketId] = pc;

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            pc.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    remoteAudio.srcObject = event.streams[0];
                }
            };

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('candidate', {
                        candidate: event.candidate,
                        targetId: monitorSocketId,
                        targetCameraId: monitorSocketId
                    });
                }
            };

            return pc;
        }

        socket.on('request-offer', async (data) => {
            const monitorSocketId = data.requesterId || data.senderId || data.targetId;
            if (!monitorSocketId) return;

            const pc = createPeerForMonitor(monitorSocketId);
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.emit('offer', {
                offer: offer,
                targetId: monitorSocketId,
                targetCameraId: monitorSocketId
            });
        });

        socket.on('answer', async (data) => {
            const senderId = data.senderId || data.requesterId || data.targetId;
            const pc = peerConnections[senderId];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer)).catch(e => console.log(e));
            }
        });

        socket.on('candidate', async (data) => {
            const senderId = data.senderId || data.requesterId || data.targetId;
            const pc = peerConnections[senderId];
            if (pc && data.candidate) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate)).catch(e => console.log(e));
            }
        });

        socket.on('camera-control', async (data) => {
            if (data.action === 'toggle-camera') {
                currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
                if (localStream) {
                    localStream.getTracks().forEach(track => track.stop());
                }
                localStream = await getMediaStream();
                localVideo.srcObject = localStream;

                for (let monitorId in peerConnections) {
                    const pc = peerConnections[monitorId];
                    const senders = pc.getSenders();
                    const videoTrack = localStream.getVideoTracks()[0];
                    const sender = senders.find(s => s.track && s.track.kind === 'video');
                    if (sender) {
                        sender.replaceTrack(videoTrack);
                    }
                }
            } else if (data.action === 'toggle-torch') {
                if (localStream) {
                    const videoTrack = localStream.getVideoTracks()[0];
                    const capabilities = videoTrack.getCapabilities();
                    if (capabilities.torch) {
                        isTorchOn = !isTorchOn;
                        await videoTrack.applyConstraints({ advanced: [{ torch: isTorchOn }] });
                    } else {
                        alert("Lanterna não suportada neste dispositivo.");
                    }
                }
            }
        });

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
